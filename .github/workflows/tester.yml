# Kör appens automatiska tester vid varje pull request och ändring på main:
#  - test/persistens.test.js  – spara/ladda, migrering, register, loggbok m.m. (jsdom)
#  - test/utskrift.test.js    – att varje layout ryms på rätt antal utskriftssidor (Chromium)
name: Tester

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installera testberoenden
        run: |
          npm install --no-save --no-package-lock jsdom playwright
          npx playwright install --with-deps chromium
      - name: Persistens, register och loggbok
        run: node persistens.test.js
      - name: Utskrift (sidantal per layout)
        run: node utskrift.test.js
